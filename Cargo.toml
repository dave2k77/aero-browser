[workspace]
members = [
    "crates/aero-core",
    "crates/aero-cdp",
    "crates/aero-perception",
    "crates/aero-executor",
    "crates/aero-agent",
    "crates/aero-cli",
]
default-members = ["crates/aero-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
aero-core = { path = "crates/aero-core" }
aero-cdp = { path = "crates/aero-cdp" }
aero-perception = { path = "crates/aero-perception" }
aero-executor = { path = "crates/aero-executor" }
aero-agent = { path = "crates/aero-agent" }
clap = { version = "4.5", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
libc = "0.2"
rusqlite = { version = "0.41.0", default-features = false, features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1.54.1", default-features = false, features = ["sync"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect"] }

# BUG-006: doctor hashes the pinned browser executable (about 300 MB) under a
# two-second deadline. Unoptimized SHA-256 cannot do that, so the dev profile
# (`cargo run`, `cargo test`, scripts/lock-browser.sh) builds it optimized.
[profile.dev.package.sha2]
opt-level = 3

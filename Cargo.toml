[workspace]
members = [
    "crates/aero-core",
    "crates/aero-cdp",
    "crates/aero-perception",
    "crates/aero-executor",
    "crates/aero-agent",
    "crates/aero-cli",
]
default-members = ["crates/aero-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
aero-core = { path = "crates/aero-core" }
aero-cdp = { path = "crates/aero-cdp" }
aero-perception = { path = "crates/aero-perception" }
aero-executor = { path = "crates/aero-executor" }
aero-agent = { path = "crates/aero-agent" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"

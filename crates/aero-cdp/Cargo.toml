[package]
name = "aero-cdp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Compiles the tests that launch the real pinned Chromium (C04). They need
# AERO_CHROMIUM and a working Bubblewrap; with AERO_REQUIRE_BROWSER=1 a missing
# prerequisite fails instead of skipping.
browser-tests = []

[dependencies]
aero-core.workspace = true
futures-util.workspace = true
libc.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

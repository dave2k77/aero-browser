<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cross calibration frame</title>
<style>
body { margin: 0; height: 900px; position: relative; }
#pay { position: absolute; left: 50px; top: 140px; width: 80px; height: 30px; }
#leaf { position: absolute; left: 200px; top: 70px; width: 200px; height: 200px; border: 2px solid black; padding: 4px; }
</style>
</head>
<body>
<button id="pay">Pay</button>
<script>
// Back to the top page's site: a nested out-of-process frame.
const leaf = document.createElement("iframe");
leaf.id = "leaf";
leaf.title = "Leaf";
leaf.src = `http://127.0.0.1:${location.port}/calibration-inner.html`;
document.body.appendChild(leaf);
window.counts = {};
window.clicks = [];
for (const type of ["pointermove", "pointerdown", "pointerup", "mousemove", "mousedown", "mouseup", "click",
                    "dblclick", "auxclick", "contextmenu"]) {
  addEventListener(type, (event) => {
    const owner = event.target.closest("[id]");
    const key = type + ":" + (owner ? owner.id : "document");
    counts[key] = (counts[key] || 0) + 1;
    if (type === "click" && owner) {
      const r = owner.getBoundingClientRect();
      clicks.push({ id: owner.id, x: event.clientX, y: event.clientY,
                    left: r.left, top: r.top, right: r.right, bottom: r.bottom });
    }
  }, true);
}
</script>
</body>
</html>

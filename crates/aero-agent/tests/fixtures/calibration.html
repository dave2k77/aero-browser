<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Frame calibration</title>
<style>
body { margin: 0; height: 2400px; position: relative; }
iframe { position: absolute; background: white; }
#same { left: 40px; top: 300px; width: 300px; height: 150px; border: 7px solid red; padding: 5px; }
#scaled { left: 420px; top: 300px; width: 300px; height: 150px; border: 4px solid blue; transform: scale(0.5); transform-origin: 0 0; }
#clipped { left: 800px; top: 300px; width: 200px; height: 100px; border: 0; }
#cross { left: 40px; top: 600px; width: 420px; height: 300px; border: 3px solid green; padding: 9px; }
#scaledcross { left: 520px; top: 600px; width: 300px; height: 200px; border: 6px solid purple; padding: 2px; transform: scale(0.5); transform-origin: 0 0; }
</style>
</head>
<body>
<iframe id="same" title="Same" src="calibration-inner.html"></iframe>
<iframe id="scaled" title="Scaled" src="calibration-inner.html"></iframe>
<iframe id="clipped" title="Clipped" src="calibration-edge.html"></iframe>
<script>
for (const [id, path] of [["cross", "calibration-cross.html"], ["scaledcross", "calibration-inner.html"]]) {
  const frame = document.createElement("iframe");
  frame.id = id;
  frame.title = id;
  frame.src = `http://localhost:${location.port}/${path}`;
  document.body.appendChild(frame);
}
window.counts = {};
window.clicks = [];
for (const type of ["pointermove", "pointerdown", "pointerup", "mousemove", "mousedown", "mouseup", "click",
                    "dblclick", "auxclick", "contextmenu"]) {
  addEventListener(type, (event) => {
    const owner = event.target.closest("[id]");
    const key = type + ":" + (owner ? owner.id : "document");
    counts[key] = (counts[key] || 0) + 1;
    if (type === "click" && owner) {
      const r = owner.getBoundingClientRect();
      clicks.push({ id: owner.id, x: event.clientX, y: event.clientY,
                    left: r.left, top: r.top, right: r.right, bottom: r.bottom });
    }
  }, true);
}
</script>
</body>
</html>
